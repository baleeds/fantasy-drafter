<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the list runs under the home indicator rather
         than stopping short of it; safe-area insets handle the padding. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- Inlined so the page makes no request for it. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🏈</text></svg>"
    />
    <title>Fantasy Drafter</title>
  </head>
  <body>
    <header id="header">
      <div class="bar">
        <!-- Both states visible: a single button showing the current mode
             reads equally as "you are here" and "tap to go here". -->
        <div class="modes" role="group" aria-label="Mode">
          <button type="button" data-mode="prep">Prep</button>
          <button type="button" data-mode="draft">Draft</button>
        </div>
        <div class="search-wrap">
          <input
            id="search"
            type="search"
            placeholder="Search a name…"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="search"
          />
          <button id="search-clear" type="button" aria-label="Clear search">×</button>
        </div>
        <button id="menu-toggle" type="button" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
            <path
              fill="currentColor"
              d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2-1.58a.5.5 0 0 0 .12-.62l-1.9-3.28a.5.5 0 0 0-.6-.22l-2.39 1a7 7 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.8a.5.5 0 0 0-.5.42l-.36 2.54a7 7 0 0 0-1.62.94l-2.39-1a.5.5 0 0 0-.6.22L2.74 8.86a.5.5 0 0 0 .12.62l2 1.58a7.07 7.07 0 0 0 0 1.88l-2 1.58a.5.5 0 0 0-.12.62l1.9 3.28a.5.5 0 0 0 .6.22l2.39-1a7 7 0 0 0 1.62.94l.36 2.54a.5.5 0 0 0 .5.42h3.8a.5.5 0 0 0 .5-.42l.36-2.54a7 7 0 0 0 1.62-.94l2.39 1a.5.5 0 0 0 .6-.22l1.9-3.28a.5.5 0 0 0-.12-.62ZM12 15.6A3.6 3.6 0 1 1 15.6 12 3.6 3.6 0 0 1 12 15.6Z"
            />
          </svg>
        </button>
      </div>

      <div id="filters" class="filters"></div>

      <div class="strip">
        <div class="strip-line">
          <span id="roster"></span>
          <label class="toggle" id="taken-toggle">
            <input id="show-drafted" type="checkbox" />
            <span>Show taken</span>
          </label>
        </div>
        <!-- What I have is above; what is left is here. -->
        <p
          id="cliffs"
          title="Best and second-best still available at each position"
        ></p>
      </div>

      <div id="menu" hidden>
        <p id="generated"></p>

        <p class="note">
          The address bar always holds your board. Bookmark it and a wiped
          browser costs you nothing.
        </p>
        <button id="copy-link" type="button">Copy board link</button>
        <button id="export" type="button">Export a backup file</button>
        <button id="import" type="button">Import a backup file</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden />

        <button id="reset-draft" type="button">Reset draft — keeps my rankings</button>
        <button id="reset-order" type="button">Reset order to KTC — keeps flags</button>
        <button id="reset-all" type="button" class="danger">Erase everything</button>
      </div>
    </header>

    <main>
      <ol id="board"></ol>
    </main>

    <button id="undo" type="button" class="undo" hidden></button>
    <p id="status" class="toast" role="status" hidden></p>

    <div id="sheet" hidden>
      <div id="sheet-backdrop"></div>
      <div class="sheet-panel">
        <div class="sheet-head">
          <div>
            <h2 id="sheet-name"></h2>
            <p id="sheet-meta"></p>
          </div>
          <button id="sheet-close" type="button" aria-label="Close">Done</button>
        </div>

        <div class="sheet-row nudges">
          <button id="sheet-up" type="button">↑ Move up</button>
          <button id="sheet-down" type="button">↓ Move down</button>
        </div>

        <!-- Toggles, not actions. Every one of these is a state the player is
             either in or not, and pressing it again is how you get out. -->
        <div class="sheet-row toggles">
          <button id="toggle-mine" class="toggle-btn" type="button" aria-pressed="false">
            Mine
          </button>
          <button id="toggle-taken" class="toggle-btn" type="button" aria-pressed="false">
            Taken
          </button>
        </div>
        <button id="toggle-dnd" class="toggle-btn sheet-row wide" type="button" aria-pressed="false">
          Do not draft
        </button>

        <label class="sheet-row">
          <input id="sheet-note" type="text" placeholder="Note…" maxlength="80" />
        </label>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
