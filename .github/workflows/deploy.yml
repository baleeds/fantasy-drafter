name: Deploy to Pages

on:
  push:
    branches: [claude/fantasy-draft-features-ivgetb]
  # A refresh commits players.json using GITHUB_TOKEN, and pushes made with
  # that token deliberately do not trigger further workflows. Without this the
  # site would keep serving yesterday's rankings until the next code change.
  workflow_run:
    workflows: ["Refresh rankings"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; always finish the one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Don't publish off the back of a refresh that failed its validation.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test the rankings pipeline
        run: npm test

      - name: Build
        run: npm run build

      # Pages must already be enabled on the repository, with its source set to
      # GitHub Actions (Settings -> Pages -> Build and deployment). This is a
      # one-time manual step and cannot be automated here: `enablement: true`
      # fails with "Resource not accessible by integration", because creating a
      # Pages site needs admin rights that GITHUB_TOKEN's `pages: write` does
      # not grant.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
